version: "3.8"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - survnet

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-surveillance}
      POSTGRES_USER: ${POSTGRES_USER:-surv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-surv} -d ${POSTGRES_DB:-surveillance}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - survnet

  detector:
    build:
      context: ./detector
      dockerfile: Dockerfile
    restart: unless-stopped
    devices:
      - /dev/video0:/dev/video0
    volumes:
      - ./data/clips:/app/data/clips
      - ./data/snapshots:/app/data/snapshots
      - ./config/config.yaml:/app/config/config.yaml:ro
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-surv}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-surveillance}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys; sys.exit(0 if os.path.exists('/tmp/detector_alive') else 1)"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Uncomment for NVIDIA GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    networks:
      - survnet

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data/clips:/app/data/clips:ro
      - ./data/snapshots:/app/data/snapshots:ro
      - ./config/config.yaml:/app/config/config.yaml:ro
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-surv}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-surveillance}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      detector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - survnet

networks:
  survnet:
    driver: bridge

volumes:
  pgdata:
